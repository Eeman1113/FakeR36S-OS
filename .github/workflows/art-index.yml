name: Refresh box art index

on:
  schedule:
    - cron: "17 4 * * 1"     # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docs/art from libretro-thumbnails
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-art-index.py
      - name: Commit if changed
        run: |
          git add docs/art
          git diff --cached --quiet && exit 0
          git -c user.name=Eeman1113 -c user.email=eeman.majumder@gmail.com commit -m "Refresh box art index"
          git push
