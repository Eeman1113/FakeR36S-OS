name: Build FakeR36S-OS (A23)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build kernel (android_boot images + dtbs)
        working-directory: kernel
        run: docker buildx build --output type=local,dest=./out .
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel/out/android_boot_a23_panel2.img
            kernel/out/dtb/ga36mb-a23-panel2.dtb
            kernel/out/kernel_config.txt

  home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle home overlay
        working-directory: home
        run: bash build.sh > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: home
          path: home/out/home.tar

  rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: rootfs/dl
          key: br-dl-${{ hashFiles('rootfs/configs/goodluck_defconfig', 'rootfs/package/**/*.mk') }}
          restore-keys: br-dl-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: rootfs/ccache
          key: br-ccache-${{ github.run_id }}
          restore-keys: br-ccache-
      - name: Build builder image
        working-directory: rootfs
        run: docker build -t fr36s-builder .
      - name: Build rootfs (Buildroot)
        working-directory: rootfs
        run: |
          mkdir -p out dl ccache
          docker run --rm \
            -v "$PWD/scripts:/src/scripts:ro" -v "$PWD/board:/src/board:ro" \
            -v "$PWD/configs:/src/configs" -v "$PWD/package:/src/package:ro" \
            -v "$PWD/out:/src/out" -v "$PWD/dl:/src/dl" -v "$PWD/ccache:/src/ccache" \
            fr36s-builder bash -c "/src/scripts/configure.sh && /src/scripts/build.sh -j$(nproc)"
          ls -la out/images
          df -h /
      - name: Make caches readable for actions/cache
        if: always()
        working-directory: rootfs
        run: sudo chown -R "$(id -u):$(id -g)" ccache dl 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: rootfs/out/images/rootfs.tar

  image:
    needs: [kernel, home, rootfs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VARIANT: a23_panel2   # GA36-MB A23 Esisla: verified on hardware 2026-11-11
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: dl/kernel }
      - uses: actions/download-artifact@v4
        with: { name: rootfs, path: dl/rootfs }
      - uses: actions/download-artifact@v4
        with: { name: home, path: dl/home }
      - name: Assemble base image (stock boot region left blank; spliced locally)
        working-directory: image
        run: |
          mkdir -p staging out
          cp ../dl/kernel/android_boot_${{ env.VARIANT }}.img staging/
          cp ../dl/rootfs/rootfs.tar ../dl/home/home.tar staging/
          docker buildx build --build-arg VARIANT=${{ env.VARIANT }} --output type=local,dest=./out .
          cd out
          gzip -9 -k goodluck_base_${{ env.VARIANT }}.img      # gzip: browsers decompress it natively (web installer)
          xz -T0 -6 goodluck_base_${{ env.VARIANT }}.img
          sha256sum goodluck_base_${{ env.VARIANT }}.img.* > SHA256SUMS.txt
      - name: Update package (for devices already running FakeR36S-OS; installed at boot by fr-update)
        run: |
          mkdir -p upd && cd upd
          cp ../dl/kernel/android_boot_${{ env.VARIANT }}.img boot.img
          # the system files only: no device nodes, virtual filesystems, HOME or the device's own flags
          python3 - ../dl/rootfs/rootfs.tar rootfs.tar.gz <<'PY'
          import sys, tarfile
          skip = ("dev/", "proc/", "sys/", "run/", "tmp/", "home/", "etc/player-flags/", "var/lib/display/")
          count = 0
          with tarfile.open(sys.argv[1]) as src, tarfile.open(sys.argv[2], "w:gz", compresslevel=6) as dst:
              for m in src:
                  n = m.name.lstrip("./") + ("/" if m.isdir() else "")
                  if any(n.startswith(p) for p in skip) or n.rstrip("/") in ("dev", "proc", "sys", "run", "tmp", "home"):
                      continue
                  dst.addfile(m, src.extractfile(m) if m.isfile() else None)
                  count += 1
          open("files_rootfs.txt", "w").write(str(count))
          PY
          gzip -9 -c ../dl/home/home.tar > home.tar.gz
          v=$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)
          {
            echo "version=$v"
            echo "variant=${{ env.VARIANT }}"
            echo "files_rootfs=$(cat files_rootfs.txt)"
            for f in boot.img rootfs.tar.gz home.tar.gz; do echo "sha256_$f=$(sha256sum $f | cut -d' ' -f1)"; done
          } > manifest.txt
          cat manifest.txt
          tar -cf ../image/out/fakers36s-update-${{ env.VARIANT }}.tar manifest.txt boot.img rootfs.tar.gz home.tar.gz
          ls -la ../image/out/
      - uses: actions/upload-artifact@v4
        with:
          name: FakeR36S-OS_base_${{ env.VARIANT }}
          path: image/out/goodluck_base_${{ env.VARIANT }}.img.xz
          compression-level: 0
      - name: Publish release (latest build)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd image/out
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "FakeR36S-OS (latest build)" --latest \
              --notes "Base image for GA36-MB A23 (panel 2). Turn it into your flashable image with the web installer or tools/make-flashable.sh. No BIOS or games are included."
          sha256sum fakers36s-update-${{ env.VARIANT }}.tar >> SHA256SUMS.txt
          gh release upload latest goodluck_base_${{ env.VARIANT }}.img.gz goodluck_base_${{ env.VARIANT }}.img.xz \
            fakers36s-update-${{ env.VARIANT }}.tar SHA256SUMS.txt --clobber
      - name: Point the release at the commit that built it
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # The 'latest' tag is created once and never moves, so the release page keeps naming
        # whichever commit first published it while the assets come from this run. Move it.
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          printf '%s\n' \
            "Base image for GA36-MB A23 (panel 2), built from ${GITHUB_SHA:0:7} on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            "" \
            "Turn it into your flashable image with the web installer or \`tools/make-flashable.sh\`." \
            "Already running FakeR36S-OS? Use \`fakers36s-update-${{ env.VARIANT }}.tar\` and skip reflashing." \
            "" \
            "No BIOS or games are included." > /tmp/notes.md
          gh release edit latest --title "FakeR36S-OS (latest build)" --notes-file /tmp/notes.md
