# Appended to every RetroArch launch by fr-launch (--appendconfig): these win over the player's
# retroarch.cfg, so autosave is always on even on cards whose config predates it.
autosave_interval = "60"
savestate_auto_save = "true"
savestate_auto_load = "true"
# fr-osd (low-battery warnings) talks to RetroArch on localhost through this port
network_cmd_enable = "true"
network_cmd_port = "55355"
